<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* ==========================================================================
     Video logo Uniemarket — vào đề kiểu yummytrack, timeline 12s:
       0.0–1.0s  các chấm chanh bay từ 2 mép vào giữa
       1.1–1.8s  gộp thành HUY HIỆU TRÒN, phóng to nảy đàn hồi
       1.8–2.4s  THỎ bật lên từ trong huy hiệu
       2.2–3.6s  chữ UNIEMARKET bật từng ký tự
       3.6–5.3s  thỏ nghiêng người TU NƯỚC CHANH (nước tụt, ga sủi mạnh)
       5.8–7.2s  nhún nhảy trong huy hiệu — nón lát chanh bật lên
       7.6–8.4s  nháy mắt + sao lóe; chấm màu bay ngang
       8.6–10.3s lắc lư theo sóng
       10.8–12s  thỏ tụt xuống trong huy hiệu, huy hiệu co về chấm -> loop
     Quay: node assets-src/record-logo.mjs (chạy từ thư mục có playwright)
     ======================================================================== */
  @font-face {
    font-family: "Baloo 2";
    src: url("file:///D:/Market/Market/uniemarket/node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2") format("woff2");
    font-weight: 800;
  }
  * { margin: 0; padding: 0; }
  html, body { width: 960px; height: 600px; overflow: hidden; }
  body {
    background:
      radial-gradient(90% 60% at 50% 108%, rgba(18, 110, 118, 0.55) 0%, rgba(14, 80, 90, 0.25) 45%, transparent 70%),
      radial-gradient(70% 50% at 50% 100%, rgba(245, 200, 66, 0.16) 0%, transparent 60%),
      #12100a;
    font-family: "Baloo 2", sans-serif;
    position: relative;
  }

  /* ---------- CHẤM BAY VÀO (mở màn) ---------- */
  @keyframes fly-in-l {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    8%   { transform: translate(var(--dx), var(--dy)) scale(0.6); opacity: 1; }
    9%, 100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
  .dot {
    position: absolute;
    border-radius: 9999px;
    animation: fly-in-l 12s cubic-bezier(0.5, 0, 0.6, 1) infinite;
  }
  /* chấm bay NGANG giữa video (điểm nhấn như yummy) */
  @keyframes fly-cross-1 {
    0%, 33% { transform: translateX(0); opacity: 0; }
    35% { opacity: 1; }
    41% { transform: translateX(-1060px); opacity: 1; }
    42%, 100% { opacity: 0; }
  }
  @keyframes fly-cross-2 {
    0%, 60% { transform: translateX(0); opacity: 0; }
    62% { opacity: 1; }
    68% { transform: translateX(1060px); opacity: 1; }
    69%, 100% { opacity: 0; }
  }

  /* ---------- HUY HIỆU TRÒN ---------- */
  @keyframes badge-act {
    0%, 8%  { transform: scale(0); }
    11%  { transform: scale(1.14); }
    13%  { transform: scale(0.95); }
    15%  { transform: scale(1); }
    50%  { transform: scale(1.015); }
    94%  { transform: scale(1); }
    97%  { transform: scale(1.1); }
    100% { transform: scale(0); }
  }
  .badge {
    position: absolute;
    left: 50%;
    top: 210px;
    width: 380px;
    height: 380px;
    margin-left: -190px;
    margin-top: -158px;
    border-radius: 9999px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #fff9e2 0%, #ffedb0 58%, #f5c842 100%);
    box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.9), 0 24px 50px rgba(0, 0, 0, 0.55), 0 0 60px rgba(245, 200, 66, 0.35);
    animation: badge-act 12s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
  }

  /* ---------- THỎ (bên trong huy hiệu) ---------- */
  @keyframes bunny-act {
    0%, 13% { transform: translateY(400px); }
    17%  { transform: translateY(-16px); }
    19%  { transform: translateY(6px); }
    21%  { transform: translateY(0); }
    26%  { transform: translateY(-6px); }
    /* tu nước chanh */
    30%  { transform: translateY(4px) rotate(7deg); }
    40%  { transform: translateY(4px) rotate(8deg); }
    44%  { transform: translateY(0) rotate(0deg); }
    /* nhún nhảy trong huy hiệu */
    48%  { transform: translateY(0) scaleY(0.9); }
    51%  { transform: translateY(-40px) scaleY(1.06); }
    54%  { transform: translateY(0) scaleY(0.92); }
    57%  { transform: translateY(-26px) scaleY(1.04); }
    60%  { transform: translateY(0) scaleY(1); }
    /* nháy mắt */
    64%  { transform: translateY(-4px) rotate(-3deg); }
    70%  { transform: translateY(0) rotate(0deg); }
    /* lắc lư */
    74%  { transform: translateY(-5px) rotate(-5deg); }
    79%  { transform: translateY(-5px) rotate(5deg); }
    84%  { transform: translateY(-5px) rotate(-4deg); }
    88%  { transform: translateY(0) rotate(0deg); }
    /* tụt xuống trước khi huy hiệu đóng */
    91%  { transform: translateY(6px); }
    95%, 100% { transform: translateY(400px); }
  }
  .bunny-inner {
    position: absolute;
    left: 50%;
    top: 58px;
    margin-left: -196px; /* dịch trái để ly nước chanh nằm gọn trong huy hiệu */
    transform-origin: 50% 90%;
    animation: bunny-act 12s ease-in-out infinite;
  }

  /* mắt: chớp + NHÁY dài ~7.5s */
  @keyframes eye-act {
    0%, 23%, 25.5%, 60%, 68%, 87%, 89.5%, 100% { transform: scaleY(1); }
    24%, 25% { transform: scaleY(0.08); }
    62%, 66% { transform: scaleY(0.1); }
    88%, 89% { transform: scaleY(0.08); }
  }
  .eye { animation: eye-act 12s linear infinite; transform-origin: 197px 220px; transform-box: view-box; }

  /* nón bật lên khi nhảy */
  @keyframes hat-act {
    0%, 47%, 62%, 100% { transform: translateY(0) rotate(0deg); }
    51%  { transform: translateY(-30px) rotate(-14deg); }
    54%  { transform: translateY(2px) rotate(4deg); }
    57%  { transform: translateY(-18px) rotate(-8deg); }
    60%  { transform: translateY(0) rotate(0deg); }
  }
  .hat { animation: hat-act 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  /* miệng: chữ w bình thường -> chu tròn ngậm ống hút khi tu nước (28–45%) */
  @keyframes mouth-idle-act {
    0%, 28%, 45%, 100% { opacity: 1; }
    29%, 44% { opacity: 0; }
  }
  .mouth-idle { animation: mouth-idle-act 12s linear infinite; }
  @keyframes mouth-drink-act {
    0%, 28%, 45%, 100% { opacity: 0; transform: scale(0.4); }
    29%  { opacity: 1; transform: scale(1); }
    /* phập phồng theo nhịp mút */
    31%  { transform: scale(1.25); }
    33%  { transform: scale(0.85); }
    35%  { transform: scale(1.2); }
    37%  { transform: scale(0.85); }
    39%  { transform: scale(1.2); }
    41%  { transform: scale(0.9); }
    43%  { opacity: 1; transform: scale(1); }
    44%  { opacity: 0; transform: scale(0.4); }
  }
  .mouth-drink { animation: mouth-drink-act 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  /* nước chanh tụt khi tu, đầy lại cuối vòng */
  @keyframes liquid-act {
    0%, 28% { transform: scaleY(1); }
    34%  { transform: scaleY(0.82); }
    40%  { transform: scaleY(0.6); }
    44%, 86% { transform: scaleY(0.55); }
    92%, 100% { transform: scaleY(1); }
  }
  .liquid { animation: liquid-act 12s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }

  @keyframes fizz {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translateY(-52px); opacity: 0; }
  }
  .fizz { animation: fizz 2s linear infinite; }
  @keyframes fizz-burst {
    0%, 29%, 45%, 100% { opacity: 0; transform: translateY(0); }
    32% { opacity: 0.95; }
    38% { opacity: 0.7; transform: translateY(-34px); }
    43% { opacity: 0; transform: translateY(-56px); }
  }
  .fizz-burst { animation: fizz-burst 12s linear infinite; }

  /* ---------- CHỮ UNIEMARKET ---------- */
  @keyframes letter-act {
    0%, 18% { opacity: 0; transform: translateY(26px) scale(0.3); }
    21%  { opacity: 1; transform: translateY(-6px) scale(1.18); }
    24%  { transform: translateY(0) scale(1); }
    93%  { opacity: 1; transform: translateY(0) scale(1); }
    98%, 100% { opacity: 0; transform: translateY(18px) scale(0.6); }
  }
  .wordmark {
    position: absolute;
    left: 50%;
    top: 462px;
    transform: translateX(-50%);
    font-size: 60px;
    font-weight: 800;
    letter-spacing: 2px;
    display: flex;
    text-shadow: 0 0 22px rgba(245, 200, 66, 0.45), 0 4px 0 #a86e00;
  }
  .wordmark span {
    display: inline-block;
    background: linear-gradient(180deg, #ffe9a8 0%, #f5c842 45%, #f0a11a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: letter-act 12s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    /* backwards: trong lúc chờ delay, giữ trạng thái 0% (ẩn) thay vì hiện sẵn */
    animation-fill-mode: backwards;
  }

  /* ---------- nền ---------- */
  @keyframes twinkle {
    0%, 100% { transform: scale(0.45); opacity: 0.15; }
    50%      { transform: scale(1); opacity: 1; }
  }
  .spark { position: absolute; animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
  @keyframes flare {
    0%, 60%, 70%, 100% { transform: scale(0.2); opacity: 0; }
    63% { transform: scale(1.5); opacity: 1; }
    66% { transform: scale(0.9); opacity: 0.7; }
  }
  .flare { position: absolute; animation: flare 12s ease-in-out infinite; transform-origin: center; }
  @keyframes wavemove { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .wave { position: absolute; left: 0; bottom: 0; width: 200%; animation: wavemove linear infinite; }
</style>
</head>
